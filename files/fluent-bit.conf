# /etc/fluent-bit/fluent-bit.conf
# Installed by Packer provisioner from files/fluent-bit.conf.
#
# Two placeholders remain after Packer installs this file:
#
#   __LOKI_HOST__   substituted by `sed` in the Packer shell provisioner
#                   (step 4) using the loki_host Packer variable.
#
#   instance=unset  intentionally left as-is in the golden image because
#                   this file is shared by every clone. Per-instance
#                   cloud-init (instance-cloud-init.yaml runcmd) patches
#                   it to instance=$(hostname) and starts the service for
#                   the first time.

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

    # --- Buffering Engine ---
    # Define the root path for filesystem buffering
    storage.path              /var/log/fluent-bit/buffers
    # 'normal' sync provides a good balance of data safety and low I/O penalty
    storage.sync              normal
    # Limit memory used to process the backlog of files on disk upon restart
    storage.backlog.mem_limit 25M

[INPUT]
    Name              systemd
    Tag               host.cloud-init
    Systemd_Filter    _SYSTEMD_UNIT=cloud-init.service

    # --- Resilience ---
    # Route this input through the filesystem buffer
    storage.type   filesystem
    # Hard cap on memory buffer before pausing data ingestion to memory (forces to disk)
    Mem_Buf_Limit  25MB

[INPUT]
    Name              systemd
    Tag               host.sshd
    Systemd_Filter    _SYSTEMD_UNIT=sshd.service

    storage.type   filesystem
    Mem_Buf_Limit  25MB

[OUTPUT]
    Name    loki
    Match   host.*
    Host    __LOKI_HOST__
    Port    3100
    Labels  job=fluentbit, instance=unset
    # Explicitly tell Fluent Bit to retry forever if Loki is down, 
    # relying on the filesystem buffer to hold the queue.
    Retry_Limit False