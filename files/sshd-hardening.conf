# /etc/ssh/sshd_config.d/99-hardening.conf
# Installed by Packer provisioner from files/sshd-hardening.conf.

# Authentication
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
KerberosAuthentication no
GSSAPIAuthentication no

# Access control
PermitRootLogin no
AllowGroups ssh-users

# Rate limiting
LoginGraceTime 30s
MaxAuthTries 4
MaxStartups 10:30:60

# Attack surface reduction
X11Forwarding no
AllowTcpForwarding local
AllowStreamLocalForwarding no
AllowAgentForwarding no
PermitTunnel no

# Logging
LogLevel VERBOSE
Banner /etc/ssh/banner.txt

# Session management
UsePAM yes                  # PAM session management breaks without this
ClientAliveInterval 300     # Kill orphaned sessions
ClientAliveCountMax 2
MaxSessions 5
TCPKeepAlive yes
Compression no

# Misc
PrintMotd no
StrictModes yes
UseDNS no