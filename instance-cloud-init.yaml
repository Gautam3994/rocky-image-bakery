#cloud-config
#
# Per-Instance Cloud-Init — runtime
#
# Consumed by cloud-init on every VM cloned from the golden image via
# a NoCloud seed (or equivalent datasource). Handles only what varies
# per instance: identity, disk growth, the fluent-bit instance label,
# and a final health-check gate.
#
# Packages, hardening files, firewall rules, and sysctl are already
# baked into the golden image by Packer — nothing here should invoke
# dnf.
#
# Template variables (envsubst before handing to cloud-init):
#   HOSTNAME       short hostname
#   FQDN           fully-qualified domain name
#   USER_NAME      primary login user to create on this instance
#   MY_PUBLIC_KEY  authorized SSH public key for USER_NAME
#   TIMEZONE       e.g. Asia/Kolkata
#
# $UPTIME is left unsubstituted — cloud-init fills it in final_message.

manage_etc_hosts: true
hostname: ${HOSTNAME:-node}
fqdn: ${FQDN:-node.lab.local}

# Hardening: Explicitly ensure the root account is locked and cannot be accessed via SSH
disable_root: true

# ssh-users group already exists in the golden image; only the user
# itself is instance-specific.
users:
  - name: ${USER_NAME}
    groups: [wheel, ssh-users]
    shell: /bin/bash
    # HARDENING NOTE: Because 'lock_passwd' is true (meaning no password exists), 
    # NOPASSWD is required here to use sudo. However, this means the PAM faillock/pwquality 
    # hardening we added earlier will not apply to this specific user. 
    # To enforce PAM sudo protections in production, change this to 'ALL=(ALL) ALL' 
    # and provision a password hash via a secure pipeline.
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${MY_PUBLIC_KEY}

timezone: ${TIMEZONE:-Asia/Kolkata}

# Grow root partition and filesystem to fill whatever disk the
# hypervisor presents. Harmless if the disk matches the image size.
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true

runcmd:
  # Hardening: Completely eradicate the temporary packer user and its home directory
  # The '|| true' ensures cloud-init doesn't fail if the user was already removed
  - userdel -r packer || true

  # fluent-bit was baked with instance=unset because the golden image
  # is shared across all clones. Patch the real hostname in and start
  # the service for the first time on this instance.
  - sed -i "s/instance=unset/instance=$(hostname)/" /etc/fluent-bit/fluent-bit.conf
  - systemctl enable --now fluent-bit

  # Health gate: verify every service the golden image baked in is
  # still running after clone boot. No package work, no dnf.
  - systemctl is-active --quiet qemu-guest-agent || exit 1
  - systemctl is-active --quiet firewalld        || exit 1
  - systemctl is-active --quiet fail2ban         || exit 1
  - systemctl is-active --quiet sshd             || exit 1
  - systemctl is-active --quiet fluent-bit       || exit 1
  - systemctl is-active --quiet chronyd          || exit 1

final_message: "${HOSTNAME} ready after $UPTIME seconds"